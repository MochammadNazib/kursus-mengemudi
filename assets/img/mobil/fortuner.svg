<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <!-- Background -->
  <rect width="400" height="250" fill="#f0f0f0"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="230" rx="150" ry="15" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Car body main (Silver/Grey) -->
  <path d="M 100 120 L 140 80 L 260 80 L 300 120 L 300 180 Q 300 200 280 200 L 120 200 Q 100 200 100 180 Z" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  
  <!-- Car top/roof (Darker) -->
  <path d="M 150 80 L 170 50 L 230 50 L 250 80 Z" fill="#a8a8a8" stroke="#808080" stroke-width="1.5"/>
  
  <!-- Windshield -->
  <path d="M 155 80 L 175 55 L 225 55 L 245 80 Z" fill="#87ceeb" opacity="0.6"/>
  
  <!-- Front window -->
  <rect x="160" y="90" width="40" height="35" fill="#87ceeb" opacity="0.5" rx="3"/>
  
  <!-- Rear window -->
  <rect x="200" y="90" width="40" height="35" fill="#87ceeb" opacity="0.5" rx="3"/>
  
  <!-- Side window -->
  <rect x="240" y="95" width="30" height="30" fill="#87ceeb" opacity="0.4" rx="2"/>
  
  <!-- Front bumper -->
  <rect x="100" y="180" width="200" height="20" fill="#333" stroke="#000" stroke-width="1"/>
  
  <!-- Grille -->
  <rect x="120" y="185" width="160" height="10" fill="#444"/>
  <line x1="140" y1="185" x2="140" y2="195" stroke="#666" stroke-width="1"/>
  <line x1="160" y1="185" x2="160" y2="195" stroke="#666" stroke-width="1"/>
  <line x1="180" y1="185" x2="180" y2="195" stroke="#666" stroke-width="1"/>
  <line x1="200" y1="185" x2="200" y2="195" stroke="#666" stroke-width="1"/>
  <line x1="220" y1="185" x2="220" y2="195" stroke="#666" stroke-width="1"/>
  <line x1="240" y1="185" x2="240" y2="195" stroke="#666" stroke-width="1"/>
  
  <!-- Headlights -->
  <circle cx="130" cy="175" r="8" fill="#ffff99" stroke="#333" stroke-width="1"/>
  <circle cx="130" cy="175" r="5" fill="#ffff66"/>
  
  <circle cx="270" cy="175" r="8" fill="#ffff99" stroke="#333" stroke-width="1"/>
  <circle cx="270" cy="175" r="5" fill="#ffff66"/>
  
  <!-- Front wheels -->
  <circle cx="140" cy="200" r="20" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="140" cy="200" r="15" fill="#555"/>
  <circle cx="140" cy="200" r="10" fill="#777"/>
  
  <!-- Rear wheels -->
  <circle cx="260" cy="200" r="20" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="260" cy="200" r="15" fill="#555"/>
  <circle cx="260" cy="200" r="10" fill="#777"/>
  
  <!-- Wheel rims detail -->
  <circle cx="140" cy="200" r="8" fill="none" stroke="#999" stroke-width="1" opacity="0.5"/>
  <circle cx="260" cy="200" r="8" fill="none" stroke="#999" stroke-width="1" opacity="0.5"/>
  
  <!-- Door line -->
  <line x1="200" y1="120" x2="200" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Handle -->
  <rect x="185" y="140" width="30" height="8" fill="#666" rx="2"/>
  <rect x="185" y="165" width="30" height="8" fill="#666" rx="2"/>
  
  <!-- License plate -->
  <rect x="120" y="205" width="60" height="20" fill="#ffff00" stroke="#000" stroke-width="2" rx="2"/>
  <text x="150" y="218" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">BG 001</text>
</svg>